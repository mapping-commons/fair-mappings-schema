---
site_name: "fair-mappings-schema"
theme:
  name: material
  # palette:
  #  scheme: slate
  #  primary: cyan
  features:
    - content.tabs.link

# for adding extra css/js see https://www.mkdocs.org/user-guide/customizing-your-theme/

plugins:
  - search
  - mknotebooks:
      execute: false
  - mermaid2:
      version: 11.4.1
  # TODO rebuild docs on schema change (https://github.com/dalito/linkml-project-copier/issues/39)
  # - gen-files:
  #     scripts:
  #       - gen_pages.py  # or any other name or path

markdown_extensions:
  # check_paths fails the build if the generated class diagram is missing (run `just gen-doc`)
  - pymdownx.snippets:
      check_paths: true

watch:
  - src/fair_mappings_schema/schema

nav:
  - Home: index.md
  - Schema: elements/index.md
  - About: about.md

exclude_docs: |
  /templates-linkml/
  /schema/class-diagram.md

site_url: https://mapping-commons.github.io/fair-mappings-schema
repo_url: https://github.com/mapping-commons/fair-mappings-schema

# Uncomment this block to enable use of Google Analytics.
# Replace the property value with your own ID.
# extra:
#   analytics:
#     provider: google
#     property: G-XXXXXXXXXX
